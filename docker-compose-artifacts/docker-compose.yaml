services:
  docker-compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.5"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  db:
    image: "docker.io/postgres:18.6-alpine"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "fulltext.apphost-13c2752090-db-data"
        read_only: false
    networks:
      - "aspire"
  api:
    image: "${API_IMAGE}"
    # No Dockerfile for this service — build it separately with:
    #   dotnet publish -c Release --os linux --arch x64 \
    #     -p:PublishProfile=DefaultContainer \
    #     -p:ContainerImageName=fulltext-api -p:ContainerImageTag=latest
    # then make sure API_IMAGE in .env matches that tag exactly so
    # Compose uses the local image instead of trying to pull it.
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      ConnectionStrings__postgres: "Host=db;Port=5432;Username=postgres;Password=${DB_PASSWORD};Database=postgres"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: "postgres"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_URI: "postgresql://postgres:${DB_PASSWORD}@db:5432/postgres"
      POSTGRES_JDBCCONNECTIONSTRING: "jdbc:postgresql://db:5432/postgres"
      POSTGRES_DATABASENAME: "postgres"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://docker-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
    expose:
      - "${API_PORT}"
    depends_on:
      db:
        condition: "service_started"
    networks:
      - "aspire"
  client:
    image: "${CLIENT_IMAGE}"
    build:
      context: ../src/FullText.Client
      dockerfile: Dockerfile
    environment:
      # http, not https — the api container only serves plain HTTP internally
      BACKEND_URL: "http://api:${API_PORT}"
      API_HTTP: "http://api:${API_PORT}"
      services__api__http__0: "http://api:${API_PORT}"
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  fulltext.apphost-13c2752090-db-data:
    driver: "local"