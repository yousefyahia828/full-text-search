<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Room — Blog Archive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="masthead">
      <p class="masthead__kicker">the archive</p>
      <h1 class="masthead__title">Reading Room</h1>
      <p class="masthead__sub">Every post, indexed and searchable.</p>
    </header>

    <form class="catalog" id="search-form" autocomplete="off">
      <label class="catalog__label" for="search-input">Search the archive</label>
      <div class="catalog__row">
        <div class="catalog__field">
          <input
            class="catalog__input"
            id="search-input"
            name="searchTerms"
            type="text"
            placeholder="Try “full text search”…"
          />
          <button
            class="catalog__input-clear"
            id="input-clear-button"
            type="button"
            aria-label="Clear search text"
            hidden
          >
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <button class="catalog__submit" type="submit">Search</button>
        <button class="catalog__clear" type="button" id="clear-button">Show all</button>
        <a
          class="catalog__download"
          id="download-link"
          href="#"
          download="blogs.json"
          title="Download archive (.json)"
          aria-label="Download archive (.json)"
        >
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 3v12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <main>
      <ol class="entries" id="entries"></ol>
      <nav class="pagination" id="pagination" hidden aria-label="Archive pages">
        <button class="pagination__btn" id="page-prev" type="button">← Prev</button>
        <span class="pagination__label" id="page-label"></span>
        <button class="pagination__btn" id="page-next" type="button">Next →</button>
      </nav>
    </main>

    <div class="reader" id="reader" hidden>
      <div class="reader__panel">
        <button class="reader__close" id="reader-close" type="button" aria-label="Close">✕</button>

        <div class="reader__loading" id="reader-loading">
          <span class="spinner" aria-hidden="true"></span>
          <span>Opening post…</span>
        </div>

        <div class="reader__content" id="reader-content" hidden>
          <p class="reader__date" id="reader-date"></p>
          <h2 class="reader__title" id="reader-title"></h2>
          <div class="reader__body" id="reader-body"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
